<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シューティングゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #fff; }
  canvas { border: 2px solid #333; display: block; }
  #ui { width: 600px; display: flex; justify-content: space-between; padding: 8px 4px; font-size: 18px; }
  #overlay { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #overlay h1 { font-size: 48px; color: #0ff; text-shadow: 0 0 20px #0ff; }
  #overlay p { font-size: 20px; color: #aaa; }
  #overlay .score { font-size: 28px; color: #ff0; }
  button { background: #0ff; color: #000; border: none; padding: 12px 32px; font-size: 20px; font-family: monospace; cursor: pointer; font-weight: bold; }
  button:hover { background: #fff; }
</style>
</head>
<body>
<div id="ui">
  <span>スコア: <span id="scoreDisplay">0</span></span>
  <span>ライフ: <span id="livesDisplay">❤❤❤</span></span>
  <span>レベル: <span id="levelDisplay">1</span></span>
</div>
<div style="position:relative">
  <canvas id="c" width="600" height="700"></canvas>
  <div id="overlay">
    <h1>SHOOTER</h1>
    <p>← → ↑ ↓ で移動 / スペースで射撃</p>
    <button id="startBtn">スタート</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const levelDisplay = document.getElementById('levelDisplay');

const W = canvas.width, H = canvas.height;

let state = 'title';
let score, lives, level, frame;
let player, bullets, enemies, enemyBullets, particles, stars;
let keys = {};

document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  overlay.style.display = 'none';
  score = 0; lives = 3; level = 1; frame = 0;
  player = { x: W/2, y: H - 60, w: 36, h: 36, speed: 5, shootCooldown: 0 };
  bullets = []; enemies = []; enemyBullets = []; particles = [];
  stars = Array.from({length: 80}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    speed: Math.random()*2+0.5, size: Math.random()*2+0.5
  }));
  state = 'playing';
  updateUI();
  loop();
}

function spawnEnemy() {
  const types = ['basic', 'tank', 'fast'];
  let weights = [0.6, 0.2, 0.2];
  if (level >= 3) weights = [0.4, 0.3, 0.3];
  const r = Math.random();
  let type = types[0];
  if (r > weights[0] + weights[1]) type = types[2];
  else if (r > weights[0]) type = types[1];

  const configs = {
    basic: { w:30, h:30, hp:1, speed:1, color:'#f44', score:10, shootRate:0.008 },
    tank:  { w:40, h:40, hp:3, speed:0.5, color:'#f84', score:30, shootRate:0.005 },
    fast:  { w:24, h:24, hp:1, speed:2.5, color:'#f4f', score:20, shootRate:0.012 },
  };
  const cfg = configs[type];
  enemies.push({
    x: Math.random()*(W - cfg.w) + cfg.w/2,
    y: -cfg.h, type, ...cfg,
    maxHp: cfg.hp,
    dx: (Math.random()-0.5) * 1.5,
  });
}

function spawnParticles(x, y, color, count=8) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 1, decay: Math.random()*0.04+0.02, color, size: Math.random()*4+2
    });
  }
}

function update() {
  frame++;

  // stars
  for (const s of stars) { s.y += s.speed; if (s.y > H) s.y = 0; }

  // player move
  if (keys['ArrowLeft'])  player.x = Math.max(player.w/2, player.x - player.speed);
  if (keys['ArrowRight']) player.x = Math.min(W - player.w/2, player.x + player.speed);
  if (keys['ArrowUp'])    player.y = Math.max(player.h/2, player.y - player.speed);
  if (keys['ArrowDown'])  player.y = Math.min(H - player.h/2, player.y + player.speed);
  if (player.shootCooldown > 0) player.shootCooldown--;
  if (keys['Space'] && player.shootCooldown <= 0) {
    bullets.push({ x: player.x, y: player.y - player.h/2, speed: 12 });
    player.shootCooldown = 10;
  }

  // player bullets
  for (let i = bullets.length-1; i >= 0; i--) {
    bullets[i].y -= bullets[i].speed;
    if (bullets[i].y < 0) bullets.splice(i, 1);
  }

  // spawn enemies
  const spawnRate = Math.max(0.01, 0.03 - level*0.003);
  if (Math.random() < spawnRate + level*0.002) spawnEnemy();

  // enemies
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;
    e.x += e.dx;
    if (e.x < e.w/2 || e.x > W-e.w/2) e.dx *= -1;

    // enemy shoot
    if (Math.random() < e.shootRate) {
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      enemyBullets.push({ x: e.x, y: e.y, vx: dx/dist*3, vy: dy/dist*3 });
    }

    // enemy off screen
    if (e.y > H + e.h) {
      enemies.splice(i, 1);
      lives--;
      updateUI();
      if (lives <= 0) gameOver();
      continue;
    }

    // player bullet collision
    for (let j = bullets.length-1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) {
        bullets.splice(j, 1);
        e.hp--;
        spawnParticles(b.x, b.y, '#ff0', 4);
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, e.color, 12);
          score += e.score;
          enemies.splice(i, 1);
          updateUI();
        }
        break;
      }
    }
  }

  // enemy bullets
  for (let i = enemyBullets.length-1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) { enemyBullets.splice(i, 1); continue; }
    if (Math.abs(b.x - player.x) < player.w/2 && Math.abs(b.y - player.y) < player.h/2) {
      enemyBullets.splice(i, 1);
      spawnParticles(player.x, player.y, '#0ff', 10);
      lives--;
      updateUI();
      if (lives <= 0) { gameOver(); return; }
    }
  }

  // particles
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // level up
  level = Math.floor(score / 200) + 1;
  levelDisplay.textContent = level;
}

function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // stars
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${s.size/3})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // player
  drawShip(player.x, player.y, player.w, player.h, '#0ff');

  // bullets
  ctx.fillStyle = '#ff0';
  for (const b of bullets) {
    ctx.fillRect(b.x-2, b.y-8, 4, 12);
  }

  // enemies
  for (const e of enemies) {
    drawEnemy(e);
    // hp bar
    if (e.maxHp > 1) {
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - e.w/2, e.y - e.h/2 - 8, e.w, 4);
      ctx.fillStyle = '#f00';
      ctx.fillRect(e.x - e.w/2, e.y - e.h/2 - 8, e.w * (e.hp/e.maxHp), 4);
    }
  }

  // enemy bullets
  ctx.fillStyle = '#f44';
  for (const b of enemyBullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawShip(x, y, w, h, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(w/2, h/2);
  ctx.lineTo(w/4, h/4);
  ctx.lineTo(-w/4, h/4);
  ctx.lineTo(-w/2, h/2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(Math.PI);
  ctx.fillStyle = e.color;
  ctx.shadowColor = e.color;
  ctx.shadowBlur = 10;
  const s = e.w;
  ctx.beginPath();
  ctx.moveTo(0, -s/2);
  ctx.lineTo(s/2, s/2);
  ctx.lineTo(s/4, s/4);
  ctx.lineTo(-s/4, s/4);
  ctx.lineTo(-s/2, s/2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function updateUI() {
  scoreDisplay.textContent = score;
  livesDisplay.textContent = '❤'.repeat(Math.max(0, lives));
}

function gameOver() {
  state = 'gameover';
  overlay.innerHTML = `
    <h1>GAME OVER</h1>
    <p class="score">スコア: ${score}</p>
    <p>レベル: ${level}</p>
    <button id="startBtn">もう一度</button>
  `;
  overlay.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function loop() {
  if (state !== 'playing') return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
