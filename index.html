<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>STELLAR FORCE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; }
  canvas { display: block; image-rendering: crisp-edges; }
  #ui {
    width: 600px; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; font-size: 15px; letter-spacing: 2px;
    background: linear-gradient(90deg, rgba(0,255,255,0.08), rgba(0,255,255,0.03), rgba(0,255,255,0.08));
    border-bottom: 1px solid rgba(0,255,255,0.2);
  }
  #ui span { text-shadow: 0 0 8px #0ff; }

  /* ===== OVERLAY (スタート / ゲームオーバー) ===== */
  #overlay {
    position: absolute; top: 0; left: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    overflow-y: auto; overflow-x: hidden;
    background: radial-gradient(ellipse at center, rgba(0,8,24,0.97) 55%, rgba(0,4,12,0.93) 100%);
    width: 600px; height: 700px;
    padding: 18px 0 12px;
    gap: 0;
  }
  #overlay::-webkit-scrollbar { width: 4px; }
  #overlay::-webkit-scrollbar-thumb { background: #0af4; border-radius: 2px; }

  .ov-title { font-size: 48px; letter-spacing: 12px; color: #0ff;
    text-shadow: 0 0 30px #0ff, 0 0 70px #08f;
    animation: pulse 2s ease-in-out infinite; margin-bottom: 2px; }
  .ov-sub { font-size: 11px; letter-spacing: 5px; color: #356; margin-bottom: 14px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.75} }

  /* 操作説明 */
  .ov-section { width: 540px; border: 1px solid #1a3a5a; background: rgba(0,20,45,0.6);
    border-radius: 2px; margin-bottom: 10px; }
  .ov-section-title { font-size: 10px; letter-spacing: 4px; color: #0af;
    padding: 5px 12px 3px; border-bottom: 1px solid #1a3a5a; }
  .ov-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; padding: 8px 12px; }
  .ov-ctrl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #7ab; }
  .ov-key { background: rgba(0,180,255,0.1); border: 1px solid #0af6;
    padding: 2px 6px; font-size: 11px; color: #0cf; border-radius: 2px; white-space: nowrap; }

  /* アイテム一覧 */
  .ov-items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; padding: 6px 10px; }
  .ov-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #89b; }
  .ov-item-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 12px; flex-shrink: 0; border: 1px solid; }
  .ov-item-name { font-size: 11px; font-weight: bold; }
  .ov-item-desc { font-size: 10px; color: #567; }

  /* 敵一覧 */
  .ov-enemies { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; padding: 6px 10px; }
  .ov-enemy { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; color: #678; text-align: center; }
  .ov-enemy-dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid; }

  /* 難易度・スタートボタン */
  .ov-diff-row { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 6px 0 8px; }
  .diff-btns { display: flex; gap: 8px; }
  .diff-btn {
    padding: 7px 18px; font-size: 12px; letter-spacing: 3px;
    background: rgba(0,20,40,0.8); color: #456; border: 1px solid #234;
    font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .diff-btn:hover { color: #adf; border-color: #4af; background: rgba(0,40,80,0.8); }
  .diff-btn.selected { color: #0ff; border-color: #0ff; background: rgba(0,60,100,0.8); text-shadow: 0 0 8px #0ff; }
  .diff-desc { font-size: 10px; color: #456; letter-spacing: 1px; height: 14px; }
  #startBtn {
    background: transparent; color: #0ff; border: 1px solid #0ff;
    padding: 10px 40px; font-size: 15px; letter-spacing: 6px;
    font-family: inherit; cursor: pointer;
    box-shadow: 0 0 16px rgba(0,255,255,0.3), inset 0 0 16px rgba(0,255,255,0.05);
    transition: all 0.2s;
  }
  #startBtn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 36px rgba(0,255,255,0.6), inset 0 0 24px rgba(0,255,255,0.1); }

  /* スコア表示 (ゲームオーバー) */
  #overlay .ov-score { font-size: 30px; color: #ff0; text-shadow: 0 0 20px #ff0; letter-spacing: 4px; margin: 6px 0; }
</style>
</head>
<body>
<div id="ui">
  <span>SCORE <span id="scoreDisplay">000000</span></span>
  <span id="livesDisplay">❤ ❤ ❤</span>
  <span>LEVEL <span id="levelDisplay">01</span></span>
</div>
<div style="position:relative">
  <canvas id="c" width="600" height="700"></canvas>
  <div id="overlay">
    <div class="ov-sub">— STELLAR FORCE —</div>
    <div class="ov-title">SHOOTER</div>

    <!-- 操作説明 -->
    <div class="ov-section">
      <div class="ov-section-title">▸ CONTROLS</div>
      <div class="ov-controls">
        <div class="ov-ctrl"><span class="ov-key">← → ↑ ↓</span>移動</div>
        <div class="ov-ctrl"><span class="ov-key">SPACE</span>ショット</div>
      </div>
    </div>

    <!-- アイテム説明 -->
    <div class="ov-section">
      <div class="ov-section-title">▸ ITEMS  (敵撃墜でランダムドロップ)</div>
      <div class="ov-items" id="itemList"></div>
    </div>

    <!-- 敵一覧 -->
    <div class="ov-section">
      <div class="ov-section-title">▸ ENEMIES</div>
      <div class="ov-enemies" id="enemyList"></div>
    </div>

    <!-- 難易度 & スタート -->
    <div class="ov-diff-row">
      <div class="diff-btns">
        <button class="diff-btn selected" data-diff="easy">EASY</button>
        <button class="diff-btn" data-diff="normal">NORMAL</button>
        <button class="diff-btn" data-diff="hard">HARD</button>
      </div>
      <div class="diff-desc" id="diffDesc">ライフ5 / 敵が遅い / 連射速め</div>
      <button id="startBtn">▶ START GAME</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const levelDisplay = document.getElementById('levelDisplay');

const W = canvas.width, H = canvas.height;
const TAU = Math.PI * 2;

// ===================== AUDIO ENGINE =====================
const AC = new (window.AudioContext || window.webkitAudioContext)();
let bgmNodes = null;

function resumeAC() { if (AC.state === 'suspended') AC.resume(); }

// --- 効果音ヘルパー ---
function playTone(freq, type, vol, dur, opts={}) {
  resumeAC();
  const t = AC.currentTime;
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.connect(gain); gain.connect(AC.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (opts.freqEnd !== undefined) osc.frequency.exponentialRampToValueAtTime(opts.freqEnd, t + dur);
  if (opts.freqEnd2 !== undefined) {
    osc.frequency.exponentialRampToValueAtTime(opts.freqEnd, t + dur * 0.5);
    osc.frequency.exponentialRampToValueAtTime(opts.freqEnd2, t + dur);
  }
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.start(t); osc.stop(t + dur);
}

function playNoise(vol, dur, hipass=200) {
  resumeAC();
  const t = AC.currentTime;
  const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = buf;
  const filter = AC.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = hipass;
  const gain = AC.createGain();
  src.connect(filter); filter.connect(gain); gain.connect(AC.destination);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.start(t); src.stop(t + dur);
}

// --- 効果音 ---
function sfxShoot() {
  playTone(880, 'square', 0.12, 0.08, { freqEnd: 440 });
  playNoise(0.04, 0.05, 2000);
}
function sfxShootPower() {
  playTone(1200, 'sawtooth', 0.15, 0.1, { freqEnd: 600 });
  playTone(600, 'square', 0.08, 0.1, { freqEnd: 300 });
  playNoise(0.05, 0.06, 1500);
}
function sfxHit() {
  playNoise(0.18, 0.07, 800);
  playTone(200, 'square', 0.08, 0.07, { freqEnd: 80 });
}
function sfxKill() {
  playTone(440, 'sawtooth', 0.15, 0.05, { freqEnd: 110 });
  playNoise(0.25, 0.15, 300);
  playTone(220, 'square', 0.10, 0.12, { freqEnd: 55 });
}
function sfxBossKill() {
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      playTone(300 - i*40, 'sawtooth', 0.2, 0.18, { freqEnd: 60 });
      playNoise(0.3, 0.2, 200);
    }, i * 80);
  }
}
function sfxItemGet() {
  [523, 659, 784, 1047].forEach((f, i) =>
    setTimeout(() => playTone(f, 'sine', 0.12, 0.1), i * 50)
  );
}
function sfxShield() {
  playTone(300, 'sine', 0.18, 0.3, { freqEnd: 150 });
  playNoise(0.12, 0.2, 500);
}
function sfxBomb() {
  playNoise(0.5, 0.4, 50);
  playTone(80, 'sawtooth', 0.3, 0.5, { freqEnd: 30 });
  playTone(160, 'square', 0.2, 0.3, { freqEnd: 40 });
}
function sfxPlayerHit() {
  playNoise(0.3, 0.2, 100);
  playTone(150, 'sawtooth', 0.2, 0.25, { freqEnd: 50 });
}
function sfxGameOver() {
  [440,370,311,262].forEach((f,i) =>
    setTimeout(() => playTone(f,'sawtooth',0.18,0.3,{freqEnd:f*0.7}), i*200)
  );
}

// --- BGM (プロシージャル チップチューン) ---
const SCALE = [0,2,4,7,9]; // ペンタトニック (半音)
const ROOT = 55; // A2

function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
function scaleNote(oct, deg) {
  const semi = SCALE[((deg % SCALE.length) + SCALE.length) % SCALE.length];
  return midiToFreq(ROOT + oct*12 + semi);
}

let bgmStep = 0, bgmTimer = null;
const BPM = 140;
const STEP_MS = (60000 / BPM) / 4; // 16分音符

// メロディパターン (スケール度数)
const MELODY = [0,2,4,2,4,7,4,2, 0,-1,0,2,4,2,0,-1];
// ベースパターン
const BASS   = [0,0,4,0,3,3,4,4, 0,0,4,0,3,3,4,0];

function startBGM() {
  if (bgmTimer) return;
  resumeAC();
  bgmStep = 0;
  bgmTimer = setInterval(tickBGM, STEP_MS);
}

function stopBGM() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

function tickBGM() {
  if (state !== 'playing') return;
  const s = bgmStep % 16;
  const t = AC.currentTime;
  const vol = 0.06;

  // メロディ (矩形波)
  if (MELODY[s] >= 0) {
    const freq = scaleNote(2, MELODY[s]);
    const osc = AC.createOscillator();
    const g = AC.createGain();
    osc.connect(g); g.connect(AC.destination);
    osc.type = 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + STEP_MS/1000 * 0.8);
    osc.start(t); osc.stop(t + STEP_MS/1000 * 0.85);
  }

  // ベース (三角波)
  {
    const freq = scaleNote(0, BASS[s]);
    const osc = AC.createOscillator();
    const g = AC.createGain();
    osc.connect(g); g.connect(AC.destination);
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const bvol = (s % 4 === 0) ? vol * 1.4 : vol * 0.7;
    g.gain.setValueAtTime(bvol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + STEP_MS/1000 * 0.6);
    osc.start(t); osc.stop(t + STEP_MS/1000 * 0.7);
  }

  // ドラム: キック (4つ打ち)
  if (s % 4 === 0) {
    playTone(120, 'sine', 0.25, 0.12, { freqEnd: 40 });
  }
  // ドラム: スネア
  if (s === 4 || s === 12) {
    playNoise(0.12, 0.08, 1000);
  }
  // ドラム: ハイハット
  if (s % 2 === 0) {
    playNoise(0.04, 0.04, 6000);
  }

  bgmStep++;
}
// ===================== END AUDIO =====================

let state = 'title';
let score, lives, level, frame;
let player, bullets, enemies, enemyBullets, particles, stars, nebulas, trails, items;
let shakeX = 0, shakeY = 0, shakeMag = 0;
let powerups = {}; // アクティブなパワーアップと残り時間
let notifications = []; // 画面上の取得通知
let keys = {};
let difficulty = 'easy';

const DIFF = {
  easy:   { lives:6, playerSpeed:6, shootCooldown:7,  enemySpeedMult:0.55, shootRateMult:0.35, spawnBase:0.016, label:'EASY' },
  normal: { lives:4, playerSpeed:5, shootCooldown:10, enemySpeedMult:0.80, shootRateMult:0.70, spawnBase:0.024, label:'NORMAL' },
  hard:   { lives:3, playerSpeed:5, shootCooldown:12, enemySpeedMult:1.10, shootRateMult:1.20, spawnBase:0.034, label:'HARD' },
};

const ENEMY_TYPES = {
  basic:    { w:28, h:28, hp:1,  speed:0.8,  color:'#ff5555', score:10,  shootRate:0.006, minLevel:1,  attack:'aimed' },
  fast:     { w:22, h:22, hp:1,  speed:2.0,  color:'#ff55ff', score:20,  shootRate:0.008, minLevel:1,  attack:'aimed' },
  tank:     { w:38, h:38, hp:3,  speed:0.45, color:'#ff9944', score:30,  shootRate:0.004, minLevel:2,  attack:'spread3' },
  zigzag:   { w:26, h:26, hp:1,  speed:1.2,  color:'#55ffff', score:25,  shootRate:0.007, minLevel:2,  attack:'aimed' },
  sniper:   { w:24, h:36, hp:2,  speed:0.7,  color:'#ffbb00', score:35,  shootRate:0.005, minLevel:3,  attack:'sniper' },
  spread:   { w:30, h:30, hp:2,  speed:0.8,  color:'#bb55ff', score:40,  shootRate:0.007, minLevel:3,  attack:'spread5' },
  bomber:   { w:42, h:42, hp:4,  speed:0.5,  color:'#ff7700', score:60,  shootRate:0.003, minLevel:4,  attack:'burst' },
  laser:    { w:28, h:44, hp:2,  speed:0.6,  color:'#00ffbb', score:50,  shootRate:0.002, minLevel:4,  attack:'laser' },
  homing:   { w:26, h:26, hp:2,  speed:1.0,  color:'#ffff55', score:45,  shootRate:0.005, minLevel:5,  attack:'homing' },
  miniboss: { w:52, h:52, hp:18, speed:0.5,  color:'#ff6622', score:150, shootRate:0.010, minLevel:5,  attack:'miniboss' },
  boss:     { w:70, h:70, hp:40, speed:0.35, color:'#ff00aa', score:400, shootRate:0.012, minLevel:10, attack:'boss' },
};

document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code==='Space') e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

// ---- アイテム定義 ----
const ITEM_DEFS = {
  heal:      { color:'#ff4466', glow:'#ff2244', symbol:'♥',  label:'HEAL +1',       desc:'ライフを1回復',             duration:0   },
  lifeup:    { color:'#ff88aa', glow:'#ff4488', symbol:'♥+', label:'LIFE UP',        desc:'ライフを2増加',             duration:0   },
  rapid:     { color:'#ffff44', glow:'#ffdd00', symbol:'≫',  label:'RAPID FIRE',     desc:'連射速度3倍（10秒）',       duration:600 },
  spread:    { color:'#44ffff', glow:'#00ddff', symbol:'◈',  label:'SPREAD SHOT',    desc:'3方向弾（8秒）',            duration:500 },
  power:     { color:'#ff8800', glow:'#ff6600', symbol:'★',  label:'POWER UP',       desc:'弾速・威力強化（8秒）',     duration:480 },
  shield:    { color:'#4488ff', glow:'#2266ff', symbol:'◉',  label:'SHIELD',         desc:'被弾1回無効（6秒）',        duration:360 },
  barrier:   { color:'#00eeff', glow:'#00ccff', symbol:'⬡',  label:'BARRIER',        desc:'360°バリア展開（5秒）',     duration:300 },
  bomb:      { color:'#ff44ff', glow:'#dd00ff', symbol:'✦',  label:'CLEAR BOMB',     desc:'全敵に大ダメージ＋弾消去', duration:0   },
  speedup:   { color:'#44ff88', glow:'#00ff66', symbol:'▲',  label:'SPEED UP',       desc:'移動速度1.5倍（7秒）',      duration:420 },
};

// 敵ごとのドロップ率 (0-1、0=ドロップなし)
const DROP_RATE = {
  basic:0.12, fast:0.14, tank:0.28, zigzag:0.18,
  sniper:0.22, spread:0.22, bomber:0.32, laser:0.28, homing:0.25,
  miniboss:1.0, boss:1.0,
};
const DROP_TABLE = {
  basic:  [{t:'heal',w:3},{t:'rapid',w:2},{t:'speedup',w:1}],
  fast:   [{t:'speedup',w:3},{t:'rapid',w:2},{t:'heal',w:1}],
  tank:   [{t:'power',w:3},{t:'heal',w:2},{t:'shield',w:1},{t:'lifeup',w:1},{t:'barrier',w:1}],
  zigzag: [{t:'rapid',w:3},{t:'spread',w:2},{t:'heal',w:1}],
  sniper: [{t:'shield',w:3},{t:'heal',w:2},{t:'power',w:1},{t:'barrier',w:1}],
  spread: [{t:'spread',w:3},{t:'rapid',w:2},{t:'heal',w:1}],
  bomber: [{t:'bomb',w:3},{t:'power',w:2},{t:'lifeup',w:1},{t:'shield',w:1}],
  laser:  [{t:'power',w:3},{t:'spread',w:2},{t:'shield',w:1},{t:'barrier',w:2}],
  homing: [{t:'shield',w:3},{t:'heal',w:2},{t:'rapid',w:1},{t:'barrier',w:1}],
  miniboss:[{t:'power',w:3},{t:'shield',w:2},{t:'barrier',w:2},{t:'heal',w:2},{t:'bomb',w:1},{t:'rapid',w:1}],
  boss:    [{t:'lifeup',w:4},{t:'power',w:3},{t:'shield',w:2},{t:'bomb',w:2},{t:'spread',w:1},{t:'barrier',w:2}],
};

// ---- 難易度説明 ----
const DIFF_DESC = {
  easy:   'ライフ5 / 敵が遅い / 連射速め',
  normal: 'ライフ3 / 標準バランス',
  hard:   'ライフ2 / 敵が速い / 連射遅い',
};
function updateDiffDesc() {
  const el = document.getElementById('diffDesc');
  if (el) el.textContent = DIFF_DESC[difficulty] || '';
}

function buildItemListEl(el) {
  if (!el) return;
  el.innerHTML = '';
  for (const [, def] of Object.entries(ITEM_DEFS)) {
    const d = document.createElement('div');
    d.className = 'ov-item';
    d.innerHTML = `
      <div class="ov-item-icon" style="color:${def.color};border-color:${def.glow};background:${def.color}22;box-shadow:0 0 6px ${def.glow}66">${def.symbol}</div>
      <div>
        <div class="ov-item-name" style="color:${def.color}">${def.label}</div>
        <div class="ov-item-desc">${def.desc}</div>
      </div>`;
    el.appendChild(d);
  }
}

function buildEnemyListEl(el) {
  if (!el) return;
  el.innerHTML = '';
  const list = [
    {name:'BASIC',  color:'#ff5555',lv:1},{name:'FAST',  color:'#ff55ff',lv:1},
    {name:'TANK',   color:'#ff9944',lv:2},{name:'ZIGZAG',color:'#55ffff',lv:2},
    {name:'SNIPER', color:'#ffbb00',lv:3},{name:'SPREAD',color:'#bb55ff',lv:3},
    {name:'BOMBER', color:'#ff7700',lv:4},{name:'LASER', color:'#00ffbb',lv:4},
    {name:'HOMING', color:'#ffff55',lv:5},{name:'BOSS',  color:'#ff00aa',lv:6},
  ];
  for (const e of list) {
    const d = document.createElement('div');
    d.className = 'ov-enemy';
    d.innerHTML = `
      <div class="ov-enemy-dot" style="background:${e.color}33;border-color:${e.color};box-shadow:0 0 5px ${e.color}88"></div>
      <span style="color:${e.color}">${e.name}</span><span>Lv${e.lv}〜</span>`;
    el.appendChild(d);
  }
}

function attachOverlayListeners() {
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      difficulty = btn.dataset.diff;
      updateDiffDesc();
    });
  });
  const sb = document.getElementById('startBtn');
  if (sb) sb.addEventListener('click', startGame);
}

// DOM ready 後に初期スタート画面を構築
document.addEventListener('DOMContentLoaded', () => {
  buildItemListEl(document.getElementById('itemList'));
  buildEnemyListEl(document.getElementById('enemyList'));
  attachOverlayListeners();
  updateDiffDesc();
});

function applyItem(type) {
  const d = ITEM_DEFS[type];
  if (d.duration > 0) {
    powerups[type] = d.duration;
    return;
  }
  // 即時効果
  switch(type) {
    case 'heal':
      lives = Math.min(lives+1, 9);
      updateUI(); break;
    case 'lifeup':
      lives = Math.min(lives+2, 9);
      updateUI(); break;
    case 'barrier':
      powerups.barrier = ITEM_DEFS.barrier.duration;
      return;
    case 'bomb':
      enemyBullets = [];
      for (const e of [...enemies]) {
        spawnParticles(e.x,e.y,e.color,10,{minSpd:2,maxSpd:5,maxSz:5});
        spawnShockwave(e.x,e.y,e.color);
        e.hp-=8;
      }
      enemies = enemies.filter(e=>e.hp>0);
      score += 50;
      sfxBomb();
      shake(15);
      updateUI(); break;
  }
}

function rollDrop(type, x, y) {
  const rate = DROP_RATE[type] || 0;
  if (Math.random() > rate) return;
  const table = DROP_TABLE[type] || [{t:'heal',w:1}];
  const total = table.reduce((s,e)=>s+e.w, 0);
  let r = Math.random()*total;
  let chosen = table[0].t;
  for (const e of table) { r-=e.w; if(r<=0){chosen=e.t;break;} }
  items.push({ x, y, type:chosen, vy:1.2, life:480, bobPhase:Math.random()*TAU, angle:0 });
}

// ---- 初期化 ----
function startGame() {
  overlay.style.display = 'none';
  const d = DIFF[difficulty];
  score = 0; lives = d.lives; level = 1; frame = 0;
  bossActive = false; waveEnemyCount = 0;
  powerups = {}; notifications = [];
  player = { x: W/2, y: H-70, w:36, h:36, speed:d.playerSpeed, shootCooldown:0, invincible:0 };
  bullets=[]; enemies=[]; enemyBullets=[]; particles=[]; trails=[]; items=[];

  // 星 3層
  stars = [
    ...Array.from({length:60}, () => ({ x:Math.random()*W, y:Math.random()*H, speed:0.3+Math.random()*0.3, r:0.5, a:0.4+Math.random()*0.3 })),
    ...Array.from({length:40}, () => ({ x:Math.random()*W, y:Math.random()*H, speed:0.6+Math.random()*0.5, r:1,   a:0.5+Math.random()*0.3 })),
    ...Array.from({length:20}, () => ({ x:Math.random()*W, y:Math.random()*H, speed:1.2+Math.random()*0.8, r:1.5, a:0.7+Math.random()*0.3 })),
  ];

  // ネビュラ
  nebulas = Array.from({length:5}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    rx: 80+Math.random()*120, ry: 50+Math.random()*80,
    hue: [200,240,280,320][Math.floor(Math.random()*4)],
    a: 0.03+Math.random()*0.04, speed: 0.15+Math.random()*0.2,
  }));

  state = 'playing';
  updateUI();
  startBGM();
  startLoop();
}

// ---- 弾生成ヘルパー ----
function shootEnemyBullet(x, y, vx, vy, color, size=4, homing=false) {
  enemyBullets.push({ x, y, vx, vy, color, size, homing, life:320 });
}

function fireAimed(e, spd=3.5) {
  const dx=player.x-e.x, dy=player.y-e.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
  shootEnemyBullet(e.x, e.y, dx/dist*spd, dy/dist*spd, e.color);
}
function fireSpread(e, ways, color, spd=3) {
  const base=Math.atan2(player.y-e.y, player.x-e.x), gap=0.26, half=(ways-1)/2;
  for (let i=0;i<ways;i++) {
    const a=base+(i-half)*gap;
    shootEnemyBullet(e.x, e.y, Math.cos(a)*spd, Math.sin(a)*spd, color||e.color);
  }
}
function fireHoming(e) {
  shootEnemyBullet(e.x, e.y, 0, 2, e.color, 5, true);
}

function fireSniper(e) {
  if (!e.chargeTimer) e.chargeTimer=0;
  e.chargeTimer++;
  if (e.chargeTimer>=60) { e.chargeTimer=0; fireAimed(e,9); }
}
function fireLaser(e) {
  if (!e.laserTimer) e.laserTimer=0;
  e.laserTimer++;
  const t=e.laserTimer%120;
  if (t===40) {
    const dx=player.x-e.x, dy=player.y-e.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
    for (let i=0;i<8;i++)
      shootEnemyBullet(e.x+dx/dist*i*18, e.y+dy/dist*i*18, dx/dist*7, dy/dist*7, e.color, 3);
  }
}
function fireBoss(e) {
  if (!e.bossPhase) e.bossPhase=0;
  if (!e.bossTimer) e.bossTimer=0;
  e.bossTimer++;
  const t=e.bossTimer;
  if (e.hp<=e.maxHp*0.5) e.bossPhase=1;
  if (e.hp<=e.maxHp*0.25) e.bossPhase=2;
  if (e.bossPhase===0) { if(t%40===0) fireSpread(e,3,e.color); }
  else if (e.bossPhase===1) { if(t%30===0) fireSpread(e,5,e.color); if(t%80===0) fireHoming(e); }
  else {
    if (t%18===0) for(let i=0;i<12;i++){const a=TAU/12*i+t*0.05; shootEnemyBullet(e.x,e.y,Math.cos(a)*3.5,Math.sin(a)*3.5,e.color);}
    if (t%45===0) fireSpread(e,5,'#fb0');
  }
}

function fireMiniboss(e) {
  if (!e.mbTimer) e.mbTimer=0;
  e.mbTimer++;
  const t=e.mbTimer;
  const phase=e.hp<=e.maxHp*0.5?1:0;
  if (phase===0) {
    if(t%50===0) fireSpread(e,3,e.color);
    if(t%90===0) fireAimed(e,5);
  } else {
    if(t%35===0) fireSpread(e,5,e.color);
    if(t%60===0) fireHoming(e);
  }
}

function onDeath(e) {
  if (e.type==='bomber')  for(let i=0;i<12;i++){const a=TAU/12*i; shootEnemyBullet(e.x,e.y,Math.cos(a)*2.8,Math.sin(a)*2.8,'#f70');}
  if (e.type==='miniboss')for(let i=0;i<8;i++) {const a=TAU/8*i;  shootEnemyBullet(e.x,e.y,Math.cos(a)*3,  Math.sin(a)*3,  e.color,5);}
  if (e.type==='boss')    for(let i=0;i<20;i++){const a=TAU/20*i; shootEnemyBullet(e.x,e.y,Math.cos(a)*3.5,Math.sin(a)*3.5,e.color,7);}
  shake(e.type==='boss'?18:e.type==='miniboss'?12:e.maxHp>2?7:3);
}

// ---- スポーン & レベル管理 ----
// bossActive: ボス/中ボス戦中フラグ（戦中は通常敵スポーン停止）
let bossActive=false;
let waveEnemyCount=0; // 現ウェーブで倒した通常敵数
const WAVE_KILL_TO_LEVEL=8; // この数だけ倒すとレベルアップ

function isBossLevel(lv) { return lv%10===0; }
function isMinibossLevel(lv) { return lv%5===0 && !isBossLevel(lv); }

function triggerWaveClear() {
  // レベルアップ
  level++;
  waveEnemyCount=0;
  levelDisplay.textContent=String(level).padStart(2,'0');
  notifications.push({text:`LEVEL ${level}`, color:'#0ff', life:150, maxLife:150});

  if (isBossLevel(level)) {
    bossActive=true;
    notifications.push({text:'★ BOSS BATTLE ★', color:'#ff00aa', life:200, maxLife:200});
    setTimeout(()=>spawnType('boss'), 800);
  } else if (isMinibossLevel(level)) {
    bossActive=true;
    notifications.push({text:'▲ MINI BOSS ▲', color:'#ff6622', life:180, maxLife:180});
    setTimeout(()=>spawnType('miniboss'), 600);
  }
}

function getSpawnTable() {
  const skip=['boss','miniboss'];
  const weights={basic:5,fast:3,tank:2,zigzag:3,sniper:2,spread:2,bomber:1,laser:1,homing:2};
  const table=[];
  for (const [type,cfg] of Object.entries(ENEMY_TYPES)) {
    if (skip.includes(type)) continue;
    if (level>=cfg.minLevel) table.push({type,weight:weights[type]||1});
  }
  return table;
}

function spawnEnemy() {
  if (bossActive) return; // ボス戦中は通常敵スポーン停止
  const table=getSpawnTable();
  if (!table.length) return;
  const total=table.reduce((s,t)=>s+t.weight,0);
  let r=Math.random()*total, chosen=table[0].type;
  for (const t of table){r-=t.weight; if(r<=0){chosen=t.type;break;}}
  spawnType(chosen);
}

function spawnType(type) {
  const d=DIFF[difficulty], cfg=ENEMY_TYPES[type];
  const isBossType=(type==='boss'||type==='miniboss');
  const sm=isBossType?1:d.enemySpeedMult;
  const rm=isBossType?1:d.shootRateMult;
  enemies.push({
    x: Math.random()*(W-cfg.w*2)+cfg.w, y:-cfg.h,
    type, w:cfg.w, h:cfg.h, hp:cfg.hp, maxHp:cfg.hp,
    speed:cfg.speed*sm, color:cfg.color, score:cfg.score,
    shootRate:cfg.shootRate*rm,
    dx:(type==='zigzag')?3:(Math.random()-0.5)*2,
    zigzagTimer:0, sniperStopped:false, angle:0,
  });
}

// ---- パーティクル ----
function spawnParticles(x, y, color, count=8, opts={}) {
  for (let i=0;i<count;i++) {
    const a=Math.random()*TAU, spd=(opts.minSpd||1)+Math.random()*(opts.maxSpd||3);
    particles.push({
      x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      life:1, decay:opts.decay||(0.02+Math.random()*0.04),
      color, size:(opts.minSz||2)+Math.random()*(opts.maxSz||4),
      type: opts.type||'square',
    });
  }
}
function spawnShockwave(x, y, color) {
  particles.push({ type:'shockwave', x, y, r:4, maxR:60, life:1, decay:0.04, color, vx:0, vy:0, size:0 });
}
function shake(mag) { shakeMag=Math.max(shakeMag,mag); }

// ---- Update ----
function update() {
  frame++;

  // スクリーンシェイク減衰
  shakeMag*=0.85;
  shakeX=(Math.random()-0.5)*shakeMag;
  shakeY=(Math.random()-0.5)*shakeMag;

  // 背景スクロール
  for (const s of stars) { s.y+=s.speed; if(s.y>H+2) {s.y=-2; s.x=Math.random()*W;} }
  for (const n of nebulas) { n.y+=n.speed; if(n.y>H+n.ry*2) n.y=-n.ry*2; }

  // player move (effSpeed は shoot ブロックより前に計算されるため後で定義、暫定で先に計算)
  const _effSpeed = DIFF[difficulty].playerSpeed * (powerups.speedup ? 1.5 : 1);
  if (keys['ArrowLeft'])  player.x=Math.max(player.w/2, player.x-_effSpeed);
  if (keys['ArrowRight']) player.x=Math.min(W-player.w/2, player.x+_effSpeed);
  if (keys['ArrowUp'])    player.y=Math.max(player.h/2, player.y-_effSpeed);
  if (keys['ArrowDown'])  player.y=Math.min(H-player.h/2, player.y+_effSpeed);
  if (player.invincible>0) player.invincible--;

  // エンジントレイル
  if (frame%2===0) {
    trails.push({x:player.x+(Math.random()-0.5)*8, y:player.y+player.h/2, life:1, decay:0.12, color:'#0cf', size:3+Math.random()*3});
  }

  // パワーアップタイマー
  for (const key of Object.keys(powerups)) {
    if (powerups[key] > 0) powerups[key]--;
    if (powerups[key] <= 0) delete powerups[key];
  }
  // 通知フェードアウト
  for (let i=notifications.length-1;i>=0;i--) {
    notifications[i].life--;
    if (notifications[i].life<=0) notifications.splice(i,1);
  }

  // 実効パラメータ
  const effSpeed = DIFF[difficulty].playerSpeed * (powerups.speedup ? 1.5 : 1);
  const effCooldown = Math.round(DIFF[difficulty].shootCooldown * (powerups.rapid ? 0.35 : 1));

  // shoot
  if (player.shootCooldown>0) player.shootCooldown--;
  if (keys['Space'] && player.shootCooldown<=0) {
    const bspd = powerups.power ? 16 : 13;
    if (powerups.spread) {
      // スプレッドショット: 3方向
      for (const angle of [-0.2, 0, 0.2]) {
        bullets.push({x:player.x, y:player.y-player.h/2, speed:bspd, angle});
      }
    } else {
      bullets.push({x:player.x, y:player.y-player.h/2, speed:bspd, angle:0});
    }
    player.shootCooldown = effCooldown;
    spawnParticles(player.x, player.y-player.h/2, '#ff8', 4, {minSpd:1,maxSpd:3,decay:0.15,minSz:1,maxSz:3});
    powerups.power ? sfxShootPower() : sfxShoot();
  }

  // player bullets
  for (let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i];
    b.y -= b.speed * Math.cos(b.angle||0);
    b.x += b.speed * Math.sin(b.angle||0);
    if (b.y<0 || b.x<0 || b.x>W) bullets.splice(i,1);
  }

  // spawn (ボス戦中はspawnEnemy内でreturn)
  const base=DIFF[difficulty].spawnBase;
  const spawnRate=Math.min(base + level*0.0015, base*2);
  if (Math.random()<spawnRate) spawnEnemy();

  // enemies
  for (let i=enemies.length-1;i>=0;i--) {
    const e=enemies[i];
    moveEnemy(e);
    doAttack(e);

    // エンジントレイル
    if (frame%3===0) {
      trails.push({x:e.x+(Math.random()-0.5)*e.w*0.4, y:e.y+e.h/2, life:0.8, decay:0.1, color:e.color, size:2+Math.random()*2});
    }

    if (e.y>H+e.h) {
      enemies.splice(i,1);
      lives--; updateUI();
      if (lives<=0){gameOver();return;}
      shake(5);
      continue;
    }

    let killed=false;
    for (let j=bullets.length-1;j>=0;j--) {
      const b=bullets[j];
      if (Math.abs(b.x-e.x)<e.w/2 && Math.abs(b.y-e.y)<e.h/2) {
        bullets.splice(j,1);
        e.hp--;
        spawnParticles(b.x, b.y, '#ff8', 5, {minSpd:1,maxSpd:4,decay:0.1,minSz:1,maxSz:3});
        sfxHit();
        if (e.hp<=0) {
          spawnParticles(e.x, e.y, e.color, e.type==='boss'?40:15, {minSpd:1,maxSpd:5,maxSz:6});
          spawnParticles(e.x, e.y, '#fff', 6, {minSpd:2,maxSpd:6,decay:0.15,maxSz:3});
          spawnShockwave(e.x, e.y, e.color);
          onDeath(e);
          rollDrop(e.type, e.x, e.y);
          e.type==='boss'||e.type==='miniboss' ? sfxBossKill() : sfxKill();
          score+=e.score;
          if (e.type==='boss'||e.type==='miniboss') {
            bossActive=false;
            // ボス撃破後に3つアイテムをドロップ
            for(let k=0;k<2;k++) setTimeout(()=>rollDrop(e.type,e.x+(Math.random()-0.5)*60,e.y+Math.random()*40),k*200);
            notifications.push({text: e.type==='boss'?'BOSS DEFEATED!':'MINI BOSS DOWN!', color:e.color, life:200,maxLife:200});
          } else {
            waveEnemyCount++;
            if (waveEnemyCount>=WAVE_KILL_TO_LEVEL) triggerWaveClear();
          }
          enemies.splice(i,1);
          updateUI(); killed=true;
        } else { shake(2); }
        break;
      }
    }
    if (killed) continue;
  }

  // enemy bullets
  for (let i=enemyBullets.length-1;i>=0;i--) {
    const b=enemyBullets[i];
    b.life--;
    if (b.homing) {
      const dx=player.x-b.x, dy=player.y-b.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
      b.vx+=dx/dist*0.15; b.vy+=dy/dist*0.15;
      const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      if(spd>4){b.vx=b.vx/spd*4;b.vy=b.vy/spd*4;}
    }
    b.x+=b.vx; b.y+=b.vy;
    if (b.life<=0||b.x<-10||b.x>W+10||b.y<-10||b.y>H+10){enemyBullets.splice(i,1);continue;}
    // バリア: 一定距離以内の弾を弾き返す
    if (powerups.barrier) {
      const bdx=b.x-player.x, bdy=b.y-player.y;
      const bdist=Math.sqrt(bdx*bdx+bdy*bdy);
      if (bdist < 50) {
        const nx=bdx/bdist, ny=bdy/bdist;
        b.vx=nx*4; b.vy=ny*4;
        b.homing=false;
        b.color='#00eeff';
        spawnParticles(b.x,b.y,'#00eeff',4,{minSpd:1,maxSpd:3,decay:0.15,minSz:1,maxSz:3});
        continue;
      }
    }
    if (player.invincible===0 && Math.abs(b.x-player.x)<player.w/2*0.8 && Math.abs(b.y-player.y)<player.h/2*0.8) {
      enemyBullets.splice(i,1);
      if (powerups.shield) {
        delete powerups.shield;
        spawnParticles(player.x,player.y,'#4488ff',12,{minSpd:2,maxSpd:5,maxSz:4});
        spawnShockwave(player.x,player.y,'#4488ff');
        sfxShield();
        shake(6); player.invincible=40;
        notifications.push({text:'SHIELD BROKEN',color:'#4488ff',life:120,maxLife:120});
      } else {
        spawnParticles(player.x, player.y, '#0ff', 14, {minSpd:2,maxSpd:6,maxSz:5});
        spawnShockwave(player.x, player.y, '#0ff');
        sfxPlayerHit();
        shake(12); lives--; player.invincible=120; updateUI();
        if (lives<=0){gameOver();return;}
      }
    }
  }

  // items
  for (let i=items.length-1;i>=0;i--) {
    const it=items[i];
    it.y+=it.vy;
    it.bobPhase+=0.06;
    it.angle+=0.04;
    it.life--;
    if (it.y>H+20 || it.life<=0){items.splice(i,1);continue;}
    // 取得判定
    if (Math.abs(it.x-player.x)<(player.w/2+12) && Math.abs(it.y-player.y)<(player.h/2+12)) {
      applyItem(it.type);
      spawnParticles(it.x,it.y,ITEM_DEFS[it.type].color,12,{minSpd:2,maxSpd:5,decay:0.08,minSz:2,maxSz:5});
      spawnShockwave(it.x,it.y,ITEM_DEFS[it.type].glow);
      sfxItemGet();
      notifications.push({text:ITEM_DEFS[it.type].label, color:ITEM_DEFS[it.type].glow, life:120, maxLife:120});
      items.splice(i,1);
    }
  }

  // trails
  for (let i=trails.length-1;i>=0;i--) {
    trails[i].life-=trails[i].decay;
    if (trails[i].life<=0) trails.splice(i,1);
  }

  // particles
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    if (p.type==='shockwave') {
      p.r+=3; p.life-=p.decay;
      if(p.life<=0) particles.splice(i,1);
    } else {
      p.vx*=0.97; p.vy*=0.97;
      p.x+=p.vx; p.y+=p.vy;
      p.life-=p.decay;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  // levelはtriggerWaveClear()で更新
  levelDisplay.textContent=String(level).padStart(2,'0');
}

function moveEnemy(e) {
  switch(e.type) {
    case 'zigzag': e.zigzagTimer++; if(e.zigzagTimer%60===0)e.dx*=-1; e.x+=e.dx; e.y+=e.speed; break;
    case 'sniper': if(e.y<80)e.y+=e.speed; else e.sniperStopped=true; break;
    case 'miniboss':
      e.x+=e.dx; if(e.x<e.w/2+10||e.x>W-e.w/2-10)e.dx*=-1;
      if(e.y<80)e.y+=e.speed; e.angle+=0.02; break;
    case 'boss':
      e.x+=e.dx; if(e.x<e.w/2+10||e.x>W-e.w/2-10)e.dx*=-1;
      if(e.y<110)e.y+=e.speed; e.angle+=0.015; break;
    case 'laser': e.y+=e.speed*0.5; e.x+=e.dx*0.5; if(e.x<e.w/2||e.x>W-e.w/2)e.dx*=-1; break;
    default: e.y+=e.speed; e.x+=e.dx; if(e.x<e.w/2||e.x>W-e.w/2)e.dx*=-1;
  }
}
function doAttack(e) {
  const cfg=ENEMY_TYPES[e.type]; if(!cfg) return;
  const roll=Math.random()<e.shootRate;
  switch(cfg.attack){
    case 'aimed':   if(roll)fireAimed(e); break;
    case 'spread3': if(roll)fireSpread(e,3); break;
    case 'spread5': if(roll)fireSpread(e,5); break;
    case 'sniper':  if(e.sniperStopped)fireSniper(e); break;
    case 'laser':   fireLaser(e); break;
    case 'homing':  if(roll)fireHoming(e); break;
    case 'burst':    if(roll)fireAimed(e); break;
    case 'miniboss': fireMiniboss(e); break;
    case 'boss':     fireBoss(e); break;
  }
}

// ---- Draw ----
function draw() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 深宇宙背景
  ctx.fillStyle='#020510';
  ctx.fillRect(-10,-10,W+20,H+20);

  // ネビュラ
  for (const n of nebulas) {
    const g=ctx.createRadialGradient(n.x,n.y,0, n.x,n.y,n.rx);
    g.addColorStop(0, `hsla(${n.hue},80%,60%,${n.a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, TAU);
    ctx.fill();
  }

  // 星
  for (const s of stars) {
    ctx.globalAlpha=s.a;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // トレイル
  for (const t of trails) {
    ctx.globalAlpha=t.life*0.6;
    ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;
    ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size/2, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // player
  if (player.invincible===0 || Math.floor(frame/4)%2===0) {
    drawPlayer();
  }

  // player bullets
  for (const b of bullets) {
    ctx.save();
    const g=ctx.createLinearGradient(b.x, b.y, b.x, b.y+14);
    g.addColorStop(0,'#fff');
    g.addColorStop(0.3,'#ff8');
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.shadowColor='#ff8';
    ctx.shadowBlur=10;
    ctx.fillRect(b.x-2, b.y-10, 4, 14);
    ctx.restore();
  }

  // particles
  for (const p of particles) {
    ctx.save();
    if (p.type==='shockwave') {
      ctx.globalAlpha=p.life*0.6;
      ctx.strokeStyle=p.color;
      ctx.shadowColor=p.color;
      ctx.shadowBlur=12;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.stroke();
    } else {
      ctx.globalAlpha=p.life;
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;
      ctx.shadowBlur=6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size/2, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // enemies
  for (const e of enemies) {
    drawEnemy(e);
    // HP bar
    if (e.maxHp>1) {
      const bx=e.x-e.w/2, by=e.y-e.h/2-10, bw=e.w;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(bx-1,by-1,bw+2,7);
      ctx.fillStyle='#300';
      ctx.fillRect(bx,by,bw,5);
      const ratio=e.hp/e.maxHp;
      const hpColor=ratio>0.5?`hsl(${120*ratio},100%,50%)`:'#f00';
      ctx.fillStyle=hpColor;
      ctx.shadowColor=hpColor;
      ctx.shadowBlur=6;
      ctx.fillRect(bx,by,bw*ratio,5);
      ctx.shadowBlur=0;
    }
    // スナイパーチャージリング
    if (e.type==='sniper' && e.chargeTimer>0) {
      const ratio=e.chargeTimer/60;
      ctx.save();
      ctx.strokeStyle=`rgba(255,180,0,${0.4+ratio*0.6})`;
      ctx.shadowColor='#fb0';
      ctx.shadowBlur=15*ratio;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(e.x,e.y,e.w/2+8,0,TAU*ratio);
      ctx.stroke();
      ctx.restore();
    }
    // レーザー照射線
    if (e.type==='laser' && e.laserTimer) {
      const t=e.laserTimer%120;
      if (t>=35&&t<=52) {
        const a=(t-35)/17;
        ctx.save();
        ctx.strokeStyle=`rgba(0,255,160,${(1-a)*0.8})`;
        ctx.shadowColor='#0fb';
        ctx.shadowBlur=20;
        ctx.lineWidth=3+a*2;
        ctx.beginPath();
        ctx.moveTo(e.x,e.y);
        ctx.lineTo(player.x,player.y);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // enemy bullets
  for (const b of enemyBullets) {
    ctx.save();
    ctx.shadowColor=b.color;
    ctx.shadowBlur=10;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.size);
    g.addColorStop(0,'#fff');
    g.addColorStop(0.4,b.color);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size,0,TAU);
    ctx.fill();
    ctx.restore();
  }

  // items
  for (const it of items) {
    const def=ITEM_DEFS[it.type];
    const bob=Math.sin(it.bobPhase)*4;
    const alpha=it.life<60 ? it.life/60 : 1;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(it.x, it.y+bob);
    // 外枠リング
    ctx.strokeStyle=def.glow;
    ctx.shadowColor=def.glow;
    ctx.shadowBlur=16;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,14,0,TAU);
    ctx.stroke();
    // 塗り
    const ig=ctx.createRadialGradient(0,0,0,0,0,13);
    ig.addColorStop(0,def.color+'99');
    ig.addColorStop(1,def.color+'22');
    ctx.fillStyle=ig;
    ctx.beginPath();
    ctx.arc(0,0,13,0,TAU);
    ctx.fill();
    // シンボル
    ctx.shadowBlur=8;
    ctx.fillStyle='#fff';
    ctx.font='bold 13px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(def.symbol,0,0);
    ctx.restore();
  }

  // 取得通知
  for (const n of notifications) {
    const t=n.life/n.maxLife;
    ctx.save();
    ctx.globalAlpha=t<0.3?t/0.3:1;
    ctx.fillStyle=n.color;
    ctx.shadowColor=n.color;
    ctx.shadowBlur=12;
    ctx.font='bold 16px monospace';
    ctx.textAlign='center';
    ctx.fillText(n.text, W/2, H/2 - 60 + (1-t)*30);
    ctx.restore();
  }

  // パワーアップ状態UI (下部)
  drawPowerupUI();

  // シールドオーラ
  if (powerups.shield) {
    const pulse=0.6+Math.sin(frame*0.1)*0.4;
    ctx.save();
    ctx.globalAlpha=pulse*0.5;
    ctx.strokeStyle='#4488ff';
    ctx.shadowColor='#4488ff';
    ctx.shadowBlur=20;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.w*0.9,0,TAU);
    ctx.stroke();
    ctx.restore();
  }

  // バリア: 六角形フィールド
  if (powerups.barrier) {
    const ratio=powerups.barrier/ITEM_DEFS.barrier.duration;
    const pulse=0.5+Math.sin(frame*0.08)*0.5;
    ctx.save();
    ctx.globalAlpha=0.3+pulse*0.3;
    ctx.strokeStyle='#00eeff';
    ctx.shadowColor='#00eeff';
    ctx.shadowBlur=24;
    ctx.lineWidth=2.5;
    // 六角形
    ctx.beginPath();
    for (let i=0;i<6;i++) {
      const a=TAU/6*i + frame*0.02;
      const r=50;
      i===0 ? ctx.moveTo(player.x+Math.cos(a)*r, player.y+Math.sin(a)*r)
            : ctx.lineTo(player.x+Math.cos(a)*r, player.y+Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.stroke();
    // 内側フィル
    ctx.globalAlpha=0.06*pulse;
    ctx.fillStyle='#00eeff';
    ctx.fill();
    // 残り時間リング
    ctx.globalAlpha=0.7;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(player.x,player.y,54,0,TAU*ratio);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore(); // shake
}

function drawPowerupUI() {
  const active=Object.entries(powerups).filter(([,v])=>v>0);
  if (!active.length) return;
  let ix=10;
  for (const [key,timer] of active) {
    const def=ITEM_DEFS[key]; if(!def||def.duration===0) continue;
    const ratio=timer/def.duration;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(ix,H-32,44,22);
    ctx.strokeStyle=def.glow;
    ctx.shadowColor=def.glow;
    ctx.shadowBlur=8;
    ctx.lineWidth=1.5;
    ctx.strokeRect(ix,H-32,44,22);
    // 残り時間バー
    ctx.fillStyle=def.color;
    ctx.fillRect(ix,H-12,44*ratio,4);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(def.symbol+' '+key.toUpperCase().slice(0,5), ix+22, H-20);
    ctx.restore();
    ix+=50;
  }
}

function drawPlayer() {
  const { x, y } = player;
  ctx.save();
  ctx.translate(x, y);

  const S = 1.0; // スケール係数（調整用）

  // ---- エンジン炎（機体の後ろ）----
  const flicker = 0.7 + Math.random() * 0.3;
  // 左エンジン炎
  for (let i = 0; i < 2; i++) {
    const fl = flicker * (i===0 ? 1 : 0.6);
    const eg = ctx.createLinearGradient(-13*S, 18*S, -13*S, 18*S + 22*S*fl);
    eg.addColorStop(0, `rgba(255,255,255,${fl})`);
    eg.addColorStop(0.3, `rgba(0,200,255,${fl*0.8})`);
    eg.addColorStop(1, 'rgba(0,80,255,0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.ellipse(-13*S, 20*S, (3+Math.random()*2)*S, (10+Math.random()*8)*S*fl, 0, 0, TAU);
    ctx.fill();
  }
  // 右エンジン炎
  for (let i = 0; i < 2; i++) {
    const fl = flicker * (i===0 ? 1 : 0.6);
    const eg = ctx.createLinearGradient(13*S, 18*S, 13*S, 18*S + 22*S*fl);
    eg.addColorStop(0, `rgba(255,255,255,${fl})`);
    eg.addColorStop(0.3, `rgba(0,200,255,${fl*0.8})`);
    eg.addColorStop(1, 'rgba(0,80,255,0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.ellipse(13*S, 20*S, (3+Math.random()*2)*S, (10+Math.random()*8)*S*fl, 0, 0, TAU);
    ctx.fill();
  }

  // ---- 主翼（後退翼） ----
  const wingGrad = ctx.createLinearGradient(0, 0, 0, 16*S);
  wingGrad.addColorStop(0, '#1a6080');
  wingGrad.addColorStop(0.5, '#0d3d55');
  wingGrad.addColorStop(1, '#0a2a3a');
  ctx.fillStyle = wingGrad;
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 12;
  // 左翼
  ctx.beginPath();
  ctx.moveTo(-4*S, 0);
  ctx.lineTo(-28*S, 14*S);
  ctx.lineTo(-22*S, 18*S);
  ctx.lineTo(-8*S,  10*S);
  ctx.closePath();
  ctx.fill();
  // 右翼
  ctx.beginPath();
  ctx.moveTo(4*S, 0);
  ctx.lineTo(28*S, 14*S);
  ctx.lineTo(22*S, 18*S);
  ctx.lineTo(8*S,  10*S);
  ctx.closePath();
  ctx.fill();

  // 翼エッジライン
  ctx.strokeStyle = 'rgba(0,220,255,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-4*S,0); ctx.lineTo(-28*S,14*S); ctx.lineTo(-22*S,18*S);
  ctx.moveTo( 4*S,0); ctx.lineTo( 28*S,14*S); ctx.lineTo( 22*S,18*S);
  ctx.stroke();

  // ---- 水平尾翼 ----
  const tailGrad = ctx.createLinearGradient(0,14*S,0,20*S);
  tailGrad.addColorStop(0,'#0d3d55'); tailGrad.addColorStop(1,'#0a2030');
  ctx.fillStyle = tailGrad;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(-4*S, 14*S); ctx.lineTo(-15*S, 18*S); ctx.lineTo(-13*S, 21*S); ctx.lineTo(-5*S, 17*S);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( 4*S, 14*S); ctx.lineTo( 15*S, 18*S); ctx.lineTo( 13*S, 21*S); ctx.lineTo( 5*S, 17*S);
  ctx.closePath(); ctx.fill();

  // ---- エンジンポッド (左右) ----
  const podGrad = ctx.createLinearGradient(-15*S,0,-9*S,0);
  podGrad.addColorStop(0,'#0a2535'); podGrad.addColorStop(0.5,'#1a6080'); podGrad.addColorStop(1,'#0d3d55');
  ctx.fillStyle = podGrad;
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.ellipse(-13*S, 12*S, 4*S, 8*S, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 13*S, 12*S, 4*S, 8*S, 0, 0, TAU); ctx.fill();
  // エンジン口リング
  ctx.strokeStyle = 'rgba(0,180,255,0.7)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(-13*S, 18*S, 3.5*S, 2*S, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse( 13*S, 18*S, 3.5*S, 2*S, 0, 0, TAU); ctx.stroke();

  // ---- 機体胴体 ----
  const bodyGrad = ctx.createLinearGradient(-6*S, -22*S, 6*S, 18*S);
  bodyGrad.addColorStop(0,   '#ffffff');
  bodyGrad.addColorStop(0.2, '#88ddff');
  bodyGrad.addColorStop(0.5, '#1a8ab0');
  bodyGrad.addColorStop(0.8, '#0d5070');
  bodyGrad.addColorStop(1,   '#0a2535');
  ctx.fillStyle = bodyGrad;
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(0, -22*S);           // ノーズ先端
  ctx.bezierCurveTo( 4*S,-16*S,  6*S,  -8*S,  6*S,  0);   // 右胴体前
  ctx.lineTo(6*S, 14*S);
  ctx.bezierCurveTo( 6*S, 18*S,  4*S,  20*S,  0,    21*S); // 後部
  ctx.bezierCurveTo(-4*S, 20*S, -6*S,  18*S, -6*S,  14*S);
  ctx.lineTo(-6*S, 0);
  ctx.bezierCurveTo(-6*S, -8*S, -4*S, -16*S,  0,   -22*S); // 左胴体前
  ctx.closePath();
  ctx.fill();

  // 胴体エッジハイライト
  ctx.strokeStyle = 'rgba(180,240,255,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-1*S,-22*S); ctx.bezierCurveTo(-1*S,-14*S, -2*S,-4*S, -2*S, 14*S);
  ctx.stroke();

  // ---- コックピットキャノピー ----
  const cockpitGrad = ctx.createRadialGradient(-1*S,-10*S,0, 0,-8*S, 6*S);
  cockpitGrad.addColorStop(0, 'rgba(200,240,255,0.95)');
  cockpitGrad.addColorStop(0.4,'rgba(80,180,220,0.7)');
  cockpitGrad.addColorStop(1, 'rgba(0,60,120,0.4)');
  ctx.fillStyle = cockpitGrad;
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#aef';
  ctx.beginPath();
  ctx.ellipse(0, -10*S, 3.5*S, 6*S, 0, 0, TAU);
  ctx.fill();
  // キャノピー反射
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-1*S, -12*S, 1.2*S, 2.5*S, -0.3, 0, TAU);
  ctx.fill();

  // ---- ミサイル（左右） ----
  ctx.fillStyle = '#0d3040';
  ctx.shadowBlur = 4;
  ctx.shadowColor = '#08f';
  ctx.beginPath(); ctx.ellipse(-20*S, 10*S, 1.8*S, 5*S, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 20*S, 10*S, 1.8*S, 5*S, 0, 0, TAU); ctx.fill();
  // ミサイル先端
  ctx.fillStyle = '#5af';
  ctx.beginPath(); ctx.ellipse(-20*S, 5.5*S, 1.5*S, 2*S, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 20*S, 5.5*S, 1.5*S, 2*S, 0, 0, TAU); ctx.fill();

  // ---- 機首ライト ----
  ctx.fillStyle = `rgba(255,255,255,${0.6+Math.sin(frame*0.05)*0.4})`;
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(0, -21*S, 1.5*S, 0, TAU); ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.shadowColor=e.color;
  ctx.shadowBlur=16;

  const g2=ctx.createRadialGradient(0,0,1,0,0,e.w/2);
  g2.addColorStop(0,'#ffffff');
  g2.addColorStop(0.35,e.color);
  g2.addColorStop(1,shadeColor(e.color,0.35));
  ctx.fillStyle=g2;

  if (e.type==='miniboss') {
    // 中ボス: 二重菱形 + 回転リング
    ctx.rotate(e.angle||0);
    ctx.beginPath();
    ctx.moveTo(0,-e.h/2); ctx.lineTo(e.w/2,0); ctx.lineTo(0,e.h/2); ctx.lineTo(-e.w/2,0);
    ctx.closePath(); ctx.fill();
    ctx.rotate(Math.PI/4);
    ctx.globalAlpha=0.5;
    ctx.beginPath();
    ctx.moveTo(0,-e.h/2*0.7); ctx.lineTo(e.w/2*0.7,0); ctx.lineTo(0,e.h/2*0.7); ctx.lineTo(-e.w/2*0.7,0);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(0,0,e.w/8,0,TAU); ctx.fill();
  } else if (e.type==='boss') {
    ctx.rotate(e.angle||0);
    for (let i=0;i<6;i++) {
      const a=TAU/6*i;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*e.w/2, Math.sin(a)*e.w/2);
      ctx.lineTo(Math.cos(a+TAU/12)*e.w/2*0.6, Math.sin(a+TAU/12)*e.w/2*0.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.shadowBlur=30;
    ctx.beginPath();
    ctx.arc(0,0,e.w/7,0,TAU);
    ctx.fill();
  } else if (e.type==='tank'||e.type==='bomber') {
    ctx.beginPath();
    ctx.moveTo(0,-e.h/2);
    ctx.lineTo(e.w/2,0);
    ctx.lineTo(0,e.h/2);
    ctx.lineTo(-e.w/2,0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=1.5;
    ctx.stroke();
  } else if (e.type==='laser') {
    ctx.fillRect(-e.w/2,-e.h/6,e.w,e.h/3);
    ctx.fillRect(-e.w/6,-e.h/2,e.w/3,e.h);
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=1;
    ctx.strokeRect(-e.w/2,-e.h/6,e.w,e.h/3);
  } else if (e.type==='sniper') {
    ctx.beginPath();
    ctx.moveTo(0,-e.h/2);
    ctx.lineTo(e.w/3,e.h/2);
    ctx.lineTo(-e.w/3,e.h/2);
    ctx.closePath();
    ctx.fill();
    // バレル
    ctx.fillStyle=e.color;
    ctx.fillRect(-2,-e.h/2-10,4,14);
  } else {
    ctx.rotate(Math.PI);
    ctx.beginPath();
    ctx.moveTo(0,-e.h/2);
    ctx.lineTo(e.w/2,e.h/2);
    ctx.lineTo(e.w/4,e.h/4);
    ctx.lineTo(-e.w/4,e.h/4);
    ctx.lineTo(-e.w/2,e.h/2);
    ctx.closePath();
    ctx.fill();
    // コックピット
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.shadowBlur=4;
    ctx.beginPath();
    ctx.ellipse(0,0,e.w/7,e.h/7,0,0,TAU);
    ctx.fill();
  }

  ctx.restore();
}

// 色を暗くするヘルパー（6桁 #rrggbb 専用）
function shadeColor(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16) * factor;
  const g = parseInt(hex.slice(3,5), 16) * factor;
  const b = parseInt(hex.slice(5,7), 16) * factor;
  return `rgb(${r|0},${g|0},${b|0})`;
}

function updateUI() {
  scoreDisplay.textContent=String(score).padStart(6,'0');
  livesDisplay.textContent=Array(Math.max(0,lives)).fill('❤').join(' ');
  levelDisplay.textContent=String(level).padStart(2,'0');
}

function gameOver() {
  state='gameover';
  stopBGM();
  sfxGameOver();
  overlay.innerHTML=`
    <div class="ov-sub">— GAME OVER —</div>
    <div class="ov-title" style="font-size:40px;margin-bottom:4px">DEFEATED</div>
    <div class="ov-score">${String(score).padStart(6,'0')}</div>
    <div style="font-size:12px;color:#456;letter-spacing:3px;margin-bottom:10px">LEVEL ${String(level).padStart(2,'0')} ／ ${DIFF[difficulty].label}</div>
    <div class="ov-section" style="width:540px">
      <div class="ov-section-title">▸ ITEMS</div>
      <div class="ov-items" id="itemList"></div>
    </div>
    <div class="ov-diff-row">
      <div class="diff-btns">
        <button class="diff-btn ${difficulty==='easy'?'selected':''}" data-diff="easy">EASY</button>
        <button class="diff-btn ${difficulty==='normal'?'selected':''}" data-diff="normal">NORMAL</button>
        <button class="diff-btn ${difficulty==='hard'?'selected':''}" data-diff="hard">HARD</button>
      </div>
      <div class="diff-desc" id="diffDesc">${DIFF_DESC[difficulty]}</div>
      <button id="startBtn">▶ RETRY</button>
    </div>
  `;
  overlay.style.display='flex';
  buildItemListEl(document.getElementById('itemList'));
  attachOverlayListeners();
  updateDiffDesc();
}

let loopId = null;
function loop() {
  if (state!=='playing') return;
  update(); draw();
  loopId = requestAnimationFrame(loop);
}

function startLoop() {
  if (loopId) cancelAnimationFrame(loopId);
  loopId = null;
  loop();
}
</script>
